[workspace]
resolver = "2"
members = [
  "crates/portwise-core",
  "crates/portwise-cli",
  "crates/portwise-mcp",
  "apps/desktop/src-tauri",
]
default-members = ["crates/portwise-core", "crates/portwise-cli", "crates/portwise-mcp"]

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Santosh Shinde"]
repository = "https://github.com/santoshshinde2012/portwise"
homepage = "https://github.com/santoshshinde2012/portwise"
keywords = ["port", "network", "process", "kill", "developer-tools"]
categories = ["command-line-utilities", "development-tools", "network-programming"]

[workspace.dependencies]
portwise-core = { path = "crates/portwise-core", version = "0.1.7" }
portwise-mcp = { path = "crates/portwise-mcp", version = "0.1.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
netstat2 = "0.11"
libc = "0.2"
humantime = "2"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
