# Keep every default detector; allow only the verified upstream shortcut example.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "global-hotkey upstream documentation names a keyboard shortcut, not a credential"
condition = "AND"
paths = ['''(^|/)vendor/global-hotkey/src/hotkey\.rs$''']
regexTarget = "match"
regexes = ['''^key, `shift\+alt\+KeyQ`$''']

[[rules.allowlists]]
description = "made-up key in a test that proves trust reasons are redacted before storage"
condition = "AND"
paths = ['''(^|/)crates/holdmap-analyzers/tests/trust\.rs$''']
regexTarget = "match"
regexes = ['''^API_KEY=sk-live-abcdefghijklmnop12345 $''']
