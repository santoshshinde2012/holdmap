name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Placeholder frontend for tauri::generate_context!
        run: mkdir -p apps/desktop/dist && echo '<html></html>' > apps/desktop/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust docs (no missing docs, no broken intra-doc links)
        run: cargo doc --no-deps --locked -p portwise-core -p portwise-mcp -p portwise
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop crate is excluded here (it has its own job); default-members are core/cli/mcp.
      - name: Clippy (platform-specific code)
        run: cargo clippy -p portwise-core -p portwise -p portwise-mcp --all-targets --locked -- -D warnings
      # Includes the docs checks: docs/cli.md vs clap, README commands and flags, Markdown links
      # and anchors, orphaned screenshots and file-naming conventions.
      - name: Test
        run: cargo test -p portwise-core -p portwise -p portwise-mcp --locked
      - name: Smoke test the CLI against the real OS
        shell: bash
        run: |
          cargo run -q -p portwise -- list --all
          cargo run -q -p portwise -- list --json > /dev/null
          cargo run -q -p portwise -- free-port --count 3
          cargo run -q -p portwise -- explain 1 || test $? -eq 1

  frontend:
    name: desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  desktop:
    name: desktop build (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
        working-directory: apps/desktop
      - name: Build the app (no installers)
        run: npx tauri build --no-bundle
        working-directory: apps/desktop
