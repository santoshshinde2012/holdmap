name: Pages

# Builds the website (site/) with the live demo (apps/desktop in browser mode) and deploys it to
# https://santoshshinde2012.github.io/holdmap/. Pull requests only build and check.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/desktop/**"
      - "docs/**"
      - "version.txt"
      - ".github/workflows/pages.yml"
      - "scripts/resolve-pages-source.mjs"
      - "scripts/release-api.mjs"
      - "scripts/test-release-security.py"
  pull_request:
    paths:
      - "site/**"
      - "apps/desktop/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "scripts/resolve-pages-source.mjs"
      - "scripts/release-api.mjs"
      - "scripts/test-release-security.py"
  # Run trusted workflow code on main; build content from the published stable tag.
  workflow_dispatch:
    inputs:
      source_tag:
        description: Published stable version tag to build (vX.Y.Z); dispatch only from main
        type: string
        required: true

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build + check
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # This workflow also builds PR and release-tag source. Keep its installs
          # out of caches that a later default-branch build could restore.
          package-manager-cache: false
      - name: Resolve website source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: node scripts/resolve-pages-source.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - name: Verify checked-out website source
        env:
          WEBSITE_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$WEBSITE_SOURCE_REVISION"
      - name: Install (desktop app, for the live demo)
        working-directory: apps/desktop
        run: npm ci
      - name: Install (site)
        working-directory: site
        run: npm ci
      - name: npm audit (all severities)
        working-directory: site
        run: npm audit
      - name: Type check
        working-directory: site
        run: npm run check
      - name: Build
        working-directory: site
        env:
          # Read-only: the latest release tag and the star count, shown on the page.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never replace the public site with download URLs inferred from unreleased source.
          HOLDMAP_SITE_REQUIRE_RELEASE: '1'
        run: npm run build
      - name: Links and size budget
        working-directory: site
        run: npm test
      - name: Install browser for the embedded demo check
        working-directory: apps/desktop
        timeout-minutes: 10
        run: |
          # The hosted image already has the browser's system libraries; the extra --with-deps packages are fonts and
          # a virtual display that headless Chromium does not need, and the Azure Ubuntu mirror serving them
          # sometimes stalls for many minutes. Download the browser alone and fall back to apt only if it will not start.
          npx playwright install chromium
          check='require("@playwright/test").chromium.launch().then((b) => b.close())'
          if ! node -e "$check"; then
            echo "::warning::Chromium needs system packages; installing them"
            printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nDPkg::Lock::Timeout "300";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null
            npx playwright install --with-deps chromium
          fi
      - name: Embedded demo end-to-end check
        working-directory: site
        run: npm run test:demo
      - name: Embedded demo failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-browser-failures
          path: site/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record the published revision
        working-directory: site
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/build-info.json', JSON.stringify({
            revision: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID,
          }) + '\n');
          JS
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
