# Static security analysis for Rust, TypeScript, Swift, Python tooling and GitHub Actions.
# Rust supports build-mode none, including the shared core, CLI, MCP and native adapter.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only pull requests still run CI (it checks the CLI reference and Markdown links).
    # CodeQL has nothing new to compile in those diffs. A skipped workflow leaves its checks
    # pending, which matters only if branch protection starts requiring these check names.
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  analyze-swift:
    name: analyze (swift)
    # The adapter is one Swift file. Main pushes and the Monday schedule still compile it.
    # Pull requests keep the Linux language jobs above. A skipped job stays in the check list.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Compile the production native capture adapter for analysis
        run: |
          xcrun swiftc -parse-as-library -emit-object -swift-version 5 \
            -target "$(uname -m)-apple-macosx11.0" \
            apps/desktop/src-tauri/native/screen_capture.swift \
            -o "$RUNNER_TEMP/holdmap-screen-capture.o"
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:swift
