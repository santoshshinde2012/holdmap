# All dependency updates arrive as ONE weekly pull request: the `all-dependencies`
# multi-ecosystem group spans cargo, both npm projects and github-actions.
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
# `commit-message` is group-only here; the `deps` prefix keeps release-please listing
# these under "Dependencies". Security updates are still raised separately by GitHub.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # The X11 hotkey regression test must use the x11rb that the vendored global-hotkey
      # 0.8.0 resolves (0.13); move it together with vendor/global-hotkey.
      - dependency-name: x11rb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /apps/desktop
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # Types follow the Node major CI and the builds use (22); bump together with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # svelte-check 4 accepts typescript ^5 || ^6 only; revisit when it supports TS 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: npm
    directory: /site
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keeps the pinned action SHAs in ci.yml, desktop-release.yml, codeql.yml, pages.yml,
  # security.yml and release-please.yml current. release.yml is generated by dist: bump dist instead.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
