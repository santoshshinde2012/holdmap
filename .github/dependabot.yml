# Weekly, grouped dependency updates. Commit messages follow Conventional Commits (`deps:`) so
# release-please lists them under "Dependencies".
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # Types follow the Node major CI and the builds use (22); bump together with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # svelte-check 4 accepts typescript ^5 || ^6 only; revisit when it supports TS 7.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Keeps the pinned action SHAs in ci.yml, desktop-release.yml, codeql.yml and
  # release-please.yml current. release.yml is generated by dist: bump dist instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
