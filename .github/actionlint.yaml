# release.yml is generated by dist 0.33.0 (don't edit it by hand). Its scripts have shellcheck
# style notes, and it writes `steps.cargo-cyclonedx.output.paths`
# (should be `outputs`). It's harmless: the SBOM is already in the dist manifest's upload list.
# Remove this once a dist release fixes it and `dist generate` has been re-run.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'property "output" is not defined in object type'
      - 'shellcheck reported issue in this script: SC(2086|2129|2001):(info|style)'
