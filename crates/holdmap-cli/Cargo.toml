[package]
name = "holdmap"
description = "See which ports, agents and tools are running — and stop the right thing safely: CLI + TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
default-run = "holdmap"

[[bin]]
name = "holdmap"
path = "src/main.rs"

[features]
default = ["osv-http", "keychain", "mcp-runner", "mcp-http"]
# HTTPS for the OSV built-in analyzer (rustls). scripts/check-cross.sh type-checks without it,
# because ring needs a C cross toolchain.
osv-http = ["holdmap-analyzers/osv-http"]
# Analyzer API keys in the OS keychain (`holdmap analyzers key`).
keychain = ["holdmap-analyzers/keychain"]
# Run user-registered local MCP analyzers, only when the user runs them.
mcp-runner = ["holdmap-analyzers/mcp-runner"]
# Reach MCP analyzers a user added by URL over Streamable HTTP (rustls, like osv-http).
mcp-http = ["mcp-runner", "holdmap-analyzers/mcp-http"]

[dependencies]
holdmap-core.workspace = true
holdmap-mcp.workspace = true
holdmap-activity.workspace = true
holdmap-analyzers = { workspace = true, default-features = false }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
humantime.workspace = true
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6"
clap_mangen = "0.3"
ratatui = "0.30"
unicode-width = "0.2"
rpassword = "7.4"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
base64 = "0.23"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true
