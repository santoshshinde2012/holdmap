[package]
name = "portwise"
description = "See which ports are in use, why, and stop the right thing safely: CLI + TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
default-run = "portwise"

[[bin]]
name = "portwise"
path = "src/main.rs"

[dependencies]
portwise-core.workspace = true
portwise-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
humantime.workspace = true
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6"
clap_mangen = "0.3"
ratatui = "0.30"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile.workspace = true

[lints]
workspace = true
