# Preset: Trivy's secret scanner (https://github.com/aquasecurity/trivy). Only the secret scanner;
# telemetry and version checks are turned off, so it needs no network.
schema = 1
id = "aquasecurity.trivy-secrets"
name = "Trivy secret scan"
publisher = "Aqua Security"
homepage = "https://github.com/aquasecurity/trivy"
license = "Apache-2.0"
summary = "Finds hard-coded credentials in a skill: cloud keys, tokens, private keys and passwords."
install = "Trivy v0.76.0: https://trivy.dev/latest/getting-started/installation/"

[runner]
kind = "cli"
command = "trivy"
args = ["fs", "--scanners", "secret", "--disable-telemetry", "--skip-version-check", "--quiet", "--format", "sarif", "--output", "{output}", "{subject.dir}"]
per_subject = "skill"
version_args = ["--version"]
version_prefix = "Version: "
timeout_secs = 120
exit_ok = [0]

[permissions]
read = ["{subject.dir}"]

[output]
format = "sarif"
