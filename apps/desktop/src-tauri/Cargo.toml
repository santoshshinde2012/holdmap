[package]
name = "holdmap-desktop"
description = "holdmap desktop & tray app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "holdmap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
holdmap-core.workspace = true
holdmap-activity.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tempfile.workspace = true
uuid = { version = "1", features = ["v4"] }
libc.workspace = true
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Release verification uses the same minisign implementation as the updater.
minisign-verify = "=0.2.5"
base64 = "0.23"
semver = "1"
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Bind the regressions directly to the audited GLib source also selected by GTK's patch.
glib = { path = "../../../vendor/glib" }
# Exercise the same X11 driver that the production shortcut plugin resolves.
global-hotkey = "0.8.0"
x11rb = "0.13.2"

[lints]
workspace = true

[package.metadata.dist]
dist = false
