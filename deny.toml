# cargo-deny (https://embarkstudios.github.io/cargo-deny/): advisories, licences, bans and
# sources for every crate in the workspace, including the desktop app. Run `cargo deny check`.

[graph]
all-features = false

[advisories]
# RustSec advisories fail the build; unmaintained crates only when we depend on them directly.
unmaintained = "workspace"
# Include transitive Rust soundness advisories, including the Linux GTK dependency chain.
unsound = "all"
# Temporary, tracked exceptions. Remove each one as soon as a fixed release exists.
ignore = [
  # zip 4.x reaches the build only through tauri-plugin-updater, which uses it on Windows
  # alone to unpack an update archive after its minisign signature is verified. No updater
  # release with zip >= 9 exists as of 2026-10-19 (2.14.0, now in use, and 3.0.0-alpha.3 require zip ^4).
  # Remove these three ignores once one does.
  { id = "RUSTSEC-2026-0367", reason = "zip SUID/SGID bits: tauri-plugin-updater only, Windows only, after signature verification; no fixed updater release yet" },
  { id = "RUSTSEC-2026-0368", reason = "zip symlink targets: tauri-plugin-updater only, Windows only, after signature verification; no fixed updater release yet" },
  { id = "RUSTSEC-2026-0369", reason = "zip permissions via symlinks: tauri-plugin-updater only, Windows only, after signature verification; no fixed updater release yet" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
