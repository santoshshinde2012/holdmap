# cargo-deny (https://embarkstudios.github.io/cargo-deny/): advisories, licences, bans and
# sources for every crate in the workspace, including the desktop app. Run `cargo deny check`.

[graph]
all-features = false

[advisories]
# RustSec advisories fail the build; unmaintained crates only when we depend on them directly.
unmaintained = "workspace"
# Include transitive Rust soundness advisories, including the Linux GTK dependency chain.
unsound = "all"
# No advisory exceptions remain; the updater now uses the fixed ZIP implementation.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Also cover the ZIP parser advisories tracked by GitHub before RustSec ingestion.
deny = [{ name = "zip", version = "<9.0.5" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
